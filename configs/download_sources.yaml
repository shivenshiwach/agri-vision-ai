sources:
  plantvillage:
    name: PlantVillage
    type: public_classification_dataset
    dataset_type: image_classification
    download_method: git_clone
    planned_for:
      - crop disease classification baselines
      - tomato, potato, and supported crop disease references
      - full PlantVillage classifier training
    license_review_required: true
    download_enabled: true
    source_url: "https://github.com/spMohanty/PlantVillage-Dataset.git"
    reference_url: "https://huggingface.co/datasets/mohanty/PlantVillage"
    output_path: "datasets/raw/plantvillage"
    notes: "Official open PlantVillage repository. Use only after license review, dataset version capture, duplicate checks, and crop-specific label mapping."
  ip102:
    name: IP102
    type: public_pest_classification_dataset
    dataset_type: image_classification_with_detection_annotations
    download_method: gdown_folder
    planned_for:
      - pest classifier baseline
      - pest detector pretraining where class overlap is reliable
      - pest label research against the full taxonomy
    license_review_required: true
    download_enabled: true
    source_url: "https://drive.google.com/drive/folders/1svFSy2Da3cVMvekBwe13mzyx38XZ9xWo?usp=sharing"
    reference_url: "https://github.com/xpwu95/IP102"
    output_path: "datasets/raw/ip102"
    notes: "Official IP102 v1.1 Google Drive folder linked from the project repository. Requires gdown for folder download."
  eurosat:
    name: EuroSAT RGB
    type: public_remote_sensing_land_cover_dataset
    dataset_type: satellite_image_classification_class_folders
    download_method: zenodo_zip_extract_class_folders
    planned_for:
      - crop vs non-crop remote-sensing sanity check
      - agriculture/non-agriculture land-cover proxy experiment
      - separate crop/land proxy baseline only
    license_review_required: true
    download_enabled: true
    version: "Zenodo record 7711810 v2, published 2018-07-22"
    license: "MIT; Copernicus Sentinel data terms also apply"
    source_url: "https://zenodo.org/records/7711810/files/EuroSAT_RGB.zip?download=1"
    reference_url: "https://github.com/phelber/EuroSAT"
    output_path: "datasets/raw/eurosat_crop_land"
    notes: "Official Zenodo RGB archive. Downloader extracts class folders for the disabled EuroSAT crop/land registry entry. Satellite imagery is a proxy only and should not be mixed with farmer phone images without an explicit experiment note."
  deepweeds:
    name: DeepWeeds Crop/Land Staging
    type: public_ground_weed_dataset
    dataset_type: image_classification_staged_to_crop_land_class_folders
    download_method: gdown_file_and_label_staging
    planned_for:
      - weed_dominant_field auxiliary proxy
      - negative weed review samples after human approval
      - separate crop/land proxy baseline only
    license_review_required: true
    download_enabled: true
    version: "Official GitHub labels plus images.zip linked from the DeepWeeds repository"
    license: "Images and annotations CC BY 4.0; repository code Apache-2.0"
    source_url: "https://drive.google.com/file/d/1xnK3B6K6KekDI55vwJ0vnc2IGoDga9cj"
    reference_url: "https://github.com/AlexOlsen/DeepWeeds"
    output_path: "datasets/raw/deepweeds_crop_land"
    notes: "Downloader fetches the official images.zip with gdown, fetches labels.csv from the official GitHub repository, stages non-negative species as weed_dominant_field, and leaves negative rows in an unmapped review folder."
  plantdoc_crop_land:
    name: PlantDoc Crop/Land Closeup Staging
    type: public_field_crop_closeup_dataset
    dataset_type: image_classification_staged_to_crop_land_class_folders
    download_method: git_clone_and_stage_crop_closeup
    planned_for:
      - crop_closeup auxiliary proxy
      - crop-visible field-image sanity check
      - separate crop/land proxy baseline only
    license_review_required: true
    download_enabled: true
    version: "Official GitHub repository snapshot at download time"
    license: "Creative Commons Attribution 4.0 International"
    source_url: "https://github.com/pratikkayal/PlantDoc-Dataset.git"
    reference_url: "https://github.com/pratikkayal/PlantDoc-Dataset"
    output_path: "datasets/raw/plantdoc_crop_land"
    notes: "Downloader clones the official PlantDoc repository and stages all train/test images under crop_closeup for scene-classifier experiments only. It does not provide land-scene classes."
  plantdoc:
    name: PlantDoc
    type: public_field_image_dataset
    dataset_type: image_classification_or_detection
    download_method: not_supported
    planned_for:
      - crop disease field-image validation
      - crop recognition references
      - disease detection or classification baselines
    license_review_required: true
    download_enabled: false
    source_url: "TBD - pending official URL and license approval"
    output_path: "datasets/raw/plantdoc"
    notes: "Useful for more realistic crop images than lab-only datasets. Review annotation format and label quality before enabling downloads."
  plantdoc_plus:
    name: PlantDoc++
    type: public_field_image_dataset
    dataset_type: image_classification_or_detection
    download_method: not_supported
    planned_for:
      - multi-dataset disease classification preparation
      - crop disease field-image validation
      - label normalization research
    license_review_required: true
    download_enabled: false
    source_url: "TBD - pending official URL and license approval"
    output_path: "datasets/raw/plantdoc_plus"
    notes: "Add only an approved export/version. Confirm whether labels are classification folders, detection annotations, or both before use."
  plantnet:
    name: PlantNet Disease Export
    type: public_or_curated_disease_dataset
    dataset_type: image_classification
    download_method: not_supported
    planned_for:
      - disease label coverage expansion
      - multi-dataset disease classification preparation
      - field-like disease imagery research
    license_review_required: true
    download_enabled: false
    source_url: "TBD - pending approved PlantNet disease export and license review"
    output_path: "datasets/raw/plantnet_disease"
    notes: "Use only disease-labeled exports. Do not mix generic species-recognition folders into the disease classifier."
  kaggle_field_diseases:
    name: Kaggle Field Disease Datasets
    type: public_dataset_portal_exports
    dataset_type: image_classification
    download_method: not_supported
    planned_for:
      - multi-dataset disease classification preparation
      - field-image disease coverage
      - class imbalance and label normalization research
    license_review_required: true
    download_enabled: false
    source_url: "TBD - per-dataset Kaggle URL and license review required"
    output_path: "datasets/raw/kaggle_field_diseases"
    notes: "Each Kaggle export must record URL, version/date, license, class layout, and known label-quality issues."
  custom_field_diseases:
    name: Custom Field Disease Collection
    type: project_owned_field_dataset
    dataset_type: image_classification
    download_method: local_staging
    planned_for:
      - project-owned disease classification data
      - Maharashtra field-condition validation
      - missing class coverage
    license_review_required: false
    download_enabled: false
    source_url: "local collection"
    output_path: "datasets/raw/custom_field_diseases"
    notes: "Stage only consented project-owned images. Keep raw images out of Git and inspect labels before any training."
  roboflow:
    name: Roboflow
    type: public_dataset_portal
    dataset_type: mixed_detection_exports
    download_method: not_supported
    planned_for:
      - YOLO-style object detection datasets
      - crop, pest, disease, and animal dataset discovery
      - annotation format conversion research
    license_review_required: true
    download_enabled: false
    source_url: "TBD - pending workspace, dataset, and license approval"
    notes: "Each Roboflow dataset must be reviewed individually for license, version, class names, and annotation quality."
  inaturalist:
    name: iNaturalist
    type: public_observation_dataset
    dataset_type: image_classification_reference
    download_method: not_supported
    planned_for:
      - pest reference imagery
      - animal, bird, rodent, and reptile reference imagery
      - species-level label research before farm-context collection
    license_review_required: true
    download_enabled: false
    source_url: "TBD - pending official URL and license approval"
    notes: "Reference images may not match farm-camera conditions. Confirm license per observation and avoid assuming field suitability."
  open_images:
    name: Open Images
    type: public_object_detection_dataset
    dataset_type: object_detection
    download_method: not_supported
    planned_for:
      - generic object detection pretraining
      - crop and animal-related baseline coverage
      - bounding-box format research
    license_review_required: true
    download_enabled: false
    source_url: "TBD - pending official URL and license approval"
    notes: "Use as weak baseline data only. Class labels may be too generic for farm-specific crop, pest, and animal decisions."
